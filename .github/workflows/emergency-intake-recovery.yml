name: Emergency Intake Recovery

on:
  push:
    branches: [production]
    paths: [.github/workflows/emergency-intake-recovery.yml]
  # Production deployment runs intake recovery after source and runtime verification.
  # Keep this separate emergency runner manual to avoid executing old code during a deploy.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-connections:
    runs-on: ubuntu-latest
    steps:
      - name: Read current connection snapshots
        env:
          INTAKE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          for id in 3546 3545 3544 3543 3542 3541 3540; do
            BODY="$(curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 --max-time 180 --get --data-urlencode 'ops=intake-mapping-snapshot' --data-urlencode "id=$id" --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$id" "$INTAKE_URL")"
            echo "CURRENT_MAPPING_$id=$BODY"
          done
          BODY="$(curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 --max-time 120 --get --data-urlencode 'ops=status-warning-reconcile-snapshot' --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$INTAKE_URL")"
          echo "CURRENT_WARNING_SNAPSHOT=$BODY"
  recover-recent-intake:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Recover and kick recent Gravity Forms intake
        shell: bash
        env:
          INTAKE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            BODY="$(curl -fsSL --max-time 75 --get               --data-urlencode "ops=intake-backstop-run" "$INTAKE_URL" || true)"
            echo "ATTEMPT=$attempt BODY=$BODY"
            if [ -n "$BODY" ] && node -e '
              const x=JSON.parse(process.argv[1]);
              process.exit(x && x.ok===true ? 0 : 1);
            ' "$BODY"; then
              echo "EMERGENCY_INTAKE_RECOVERY_PASS"
              exit 0
            fi
            sleep 3
          done
          echo "EMERGENCY_INTAKE_RECOVERY_FAILED"
          exit 1
