name: V2 tests
on:
  push:
    branches:
      - refactor/v2-shadow-resolver-20260917
  pull_request:
    paths:
      - 'staging/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shadow resolver tests
        run: node staging/tests/test_v2_shadow_resolver.js
      - name: Controller tests
        run: node staging/tests/test_v2_controller.js
