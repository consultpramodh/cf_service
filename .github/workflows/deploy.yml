name: Deploy CF ServiceOps v5.14.2
# RECENT10_REDEPLOY_TRIGGER_20261006

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - .github/workflows/deploy.yml
      - scripts/release.mjs
      - src/20_Intake_Processing.gs
      - src/40_Matching_Profile.gs
      - src/50_Operator_Queue.gs
      - src/60_Striven_Write.gs
      - src/70_Workflow_Automation.gs
      - src/95_Public_Runners.gs
      - src/99_Production_Hardening.gs

permissions:
  contents: read

concurrency:
  # v2 key intentionally releases the corrected request-scoped acceptance run
  # from the obsolete shared-queue acceptance job. Future v2 runs remain serialized.
  group: cf-serviceops-production-v2
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

    steps:
      - name: Checkout canonical production source
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require existing clasp authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}" || { echo "CLASPRC_JSON repository secret is missing."; exit 2; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx -y @google/clasp@3.3.0 show-authorized-user --json

      - name: Deploy checkpointed single-model release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs --execute

      - name: Verify live single-model runtime
        shell: bash
        env:
          HEALTH_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            BODY="$(curl -fsSL --retry 2 --max-time 20 "$HEALTH_URL" || true)"
            if [ -n "$BODY" ]; then
              echo "LIVE_HEALTH_ATTEMPT=$attempt $BODY"
              if node -e '
                const x = JSON.parse(process.argv[1]);
                const ok =
                  x &&
                  x.version === "5.14.2" &&
                  x.singleModelVerified === true &&
                  x.automationEnabled === true &&
                  Number(x.legacyAutomationTriggerCount) === 0 &&
                  Number(x.watchdogTriggers) === 1 &&
                  Number(x.finalWorkerTriggers) <= 1;
                process.exit(ok ? 0 : 1);
              ' "$BODY"; then
                echo "LIVE_SINGLE_MODEL_VERIFY_PASS"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "LIVE_SINGLE_MODEL_VERIFY_FAILED"
          exit 1

      - name: Run frozen recent-10 acceptance cohort
        shell: bash
        env:
          ACCEPTANCE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          IDS=(
            SR-20261006104413-7346
            SR-20261005182859-2159
            SR-20261005121227-9352
            SR-20261005084731-2148
            SR-20261004220141-5643
            SR-20261004203633-9340
            SR-20261004115129-2627
            SR-20261004104029-7927
            SR-20261003160054-7269
            SR-20261003120429-6643
          )
          : > recent10-acceptance.jsonl
          for id in "${IDS[@]}"; do
            completed=0
            for round in $(seq 1 8); do
              BODY="$(curl -fsSL --retry 2 --max-time 120 --get \
                --data-urlencode "ops=recent10-acceptance-step" \
                --data-urlencode "id=$id" "$ACCEPTANCE_URL")"
              printf '%s\n' "$BODY" | tee -a recent10-acceptance.jsonl
              if node -e '
                const x=JSON.parse(process.argv[1]);
                if(!x || x.requestId!==process.argv[2]) process.exit(2);
                const done=x.currentStage==="COMPLETED" && x.requestStatus==="COMPLETED" && String(x.manualReview||"").toUpperCase()!=="YES";
                process.exit(done ? 0 : 1);
              ' "$BODY" "$id"; then
                completed=1
                break
              fi
              sleep 2
            done
            if [ "$completed" -ne 1 ]; then
              echo "RECENT10_REQUEST_FAILED_TO_COMPLETE=$id"
              exit 3
            fi
          done
          echo "RECENT10_ACCEPTANCE_PASS_ALL_10"

      - name: Refresh live Dashboard
        shell: bash
        env:
          DASHBOARD_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --max-time 90 --get \
            --data-urlencode "ops=dashboard-refresh" "$DASHBOARD_URL")"
          echo "DASHBOARD_REFRESH=$BODY"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x || x.ok!==true || x.status!=="DASHBOARD_REFRESHED") process.exit(2);
            if(!x.metrics || Number(x.metrics.total||0)<1) process.exit(3);
            console.log("DASHBOARD_REFRESH_PASS");
          ' "$BODY"

      - name: Reconcile stale Status warnings one request at a time
        shell: bash
        env:
          RECONCILE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -u
          : > status-warning-reconciliation.jsonl
          SNAP="$(curl -fsSL --max-time 45 --get \
            --data-urlencode "ops=status-warning-reconcile-snapshot" "$RECONCILE_URL")" || {
              echo "STATUS_WARNING_SNAPSHOT_FAILED"
              exit 0
            }
          printf '%s\n' "$SNAP" | tee -a status-warning-reconciliation.jsonl
          mapfile -t IDS < <(node -e '
            const x=JSON.parse(process.argv[1]);
            const ids=Array.isArray(x.recoverableRequestIds)?x.recoverableRequestIds:[];
            ids.slice(0,20).forEach(id=>console.log(id));
          ' "$SNAP")
          echo "STATUS_WARNING_REQUEST_SCOPED_COUNT=${#IDS[@]}"
          for id in "${IDS[@]}"; do
            [ -n "$id" ] || continue
            echo "STATUS_WARNING_RECONCILE_REQUEST=$id"
            BODY="$(curl -fsSL --max-time 90 --get \
              --data-urlencode "ops=status-warning-reconcile-one" \
              --data-urlencode "id=$id" "$RECONCILE_URL" 2>/dev/null)"
            rc=$?
            if [ "$rc" -ne 0 ] || [ -z "$BODY" ]; then
              printf '{"requestId":"%s","status":"HTTP_TIMEOUT_OR_NO_RESPONSE","curlExit":%s}\n' "$id" "$rc" | tee -a status-warning-reconciliation.jsonl
              continue
            fi
            printf '%s\n' "$BODY" | tee -a status-warning-reconciliation.jsonl
          done
          REFRESH="$(curl -fsSL --max-time 120 --get \
            --data-urlencode "ops=status-warning-reconcile-refresh" "$RECONCILE_URL" 2>/dev/null)"
          if [ -n "$REFRESH" ]; then printf '%s\n' "$REFRESH" | tee -a status-warning-reconciliation.jsonl; fi
          FINAL="$(curl -fsSL --max-time 45 --get \
            --data-urlencode "ops=status-warning-reconcile-snapshot" "$RECONCILE_URL" 2>/dev/null)"
          if [ -n "$FINAL" ]; then
            printf '%s\n' "$FINAL" | tee -a status-warning-reconciliation.jsonl
            echo "STATUS_WARNING_FINAL_SNAPSHOT=$FINAL"
          fi
          exit 0

      - name: Upload status-warning reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-status-warning-reconciliation
          path: status-warning-reconciliation.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Upload recent-10 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-recent10-acceptance
          path: recent10-acceptance.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Upload pre-change live checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-live-before-v5.14.2
          path: |
            .release-v5.14.2/before/**
            .release-v5.14.2/before.sha256.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-v5.14.2-deploy-verification
          path: |
            .release-v5.14.2/verify/**
            .release-v5.14.2/deployed-version.txt
          retention-days: 30
          if-no-files-found: warn
