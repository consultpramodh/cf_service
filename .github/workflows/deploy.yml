name: CF ServiceOps deployment — use v5.14.1 release script

on:
  workflow_dispatch:

jobs:
  deployment-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment moved to checkpointed v5.14.1 release script
        shell: bash
        run: |
          echo 'This workflow is intentionally disabled to prevent partial/stale deployment.'
          echo 'Canonical production source is the production branch.'
          echo 'Run: node scripts/release.mjs --execute'
          echo 'That release pulls live source, checkpoints it, replaces all seven finalized modules,'
          echo 'rejects legacy automation source, pushes the same Script ID, verifies remote parity,'
          echo 'and redeploys the existing web app.'
