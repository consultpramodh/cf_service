name: Deploy CF ServiceOps v5.14.3

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - .github/workflows/deploy.yml
      - package.json
      - release.config.json
      - scripts/release.mjs
      - src/20_Intake_Processing.gs
      - src/30_Striven_Data.gs
      - src/40_Matching_Profile.gs
      - src/50_Operator_Queue.gs
      - src/60_Striven_Write.gs
      - src/70_Workflow_Automation.gs
      - src/95_Public_Runners.gs
      - src/99_Production_Hardening.gs

permissions:
  contents: read

concurrency:
  group: cf-serviceops-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

    steps:
      - name: Checkout canonical production source
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require existing clasp authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}" || { echo "CLASPRC_JSON repository secret is missing."; exit 2; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx -y @google/clasp@3.3.0 show-authorized-user --json

      - name: Deploy checkpointed unified-pipeline release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs --execute --description "v5.14.3 unified end-to-end ServiceOps pipeline"

      - name: Verify live read-only unified runtime
        shell: bash
        env:
          HEALTH_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec?ops=health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            BODY="$(curl -fsSL --retry 2 --max-time 20 "$HEALTH_URL" || true)"
            if [ -n "$BODY" ]; then
              echo "LIVE_HEALTH_ATTEMPT=$attempt $BODY"
              if node -e '
                const x = JSON.parse(process.argv[1]);
                const ok =
                  x &&
                  x.version === "5.14.3" &&
                  x.readOnly === true &&
                  x.liveWriteExecuted === false &&
                  x.singleModelVerified === true &&
                  x.automationEnabled === true &&
                  Number(x.legacyAutomationTriggerCount) === 0 &&
                  Number(x.watchdogTriggers) === 1 &&
                  Number(x.finalWorkerTriggers) <= 1;
                process.exit(ok ? 0 : 1);
              ' "$BODY"; then
                echo "LIVE_UNIFIED_PIPELINE_VERIFY_PASS"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "LIVE_UNIFIED_PIPELINE_VERIFY_FAILED"
          exit 1

      - name: Upload pre-change live checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-live-before-v5.14.3
          path: |
            .release-checkpoints/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-v5.14.3-deploy-verification
          path: |
            .release-work/current/**
          retention-days: 30
          if-no-files-found: warn
