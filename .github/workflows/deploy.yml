name: Deploy CF ServiceOps v5.14.4
# RECENT10_REDEPLOY_TRIGGER_20261006

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - .github/workflows/deploy.yml
      - scripts/release.mjs
      - src/20_Intake_Processing.gs
      - src/40_Matching_Profile.gs
      - src/50_Operator_Queue.gs
      - src/60_Striven_Write.gs
      - src/70_Workflow_Automation.gs
      - src/95_Public_Runners.gs
      - src/99_Production_Hardening.gs

permissions:
  contents: read

concurrency:
  # v2 key intentionally releases the corrected request-scoped acceptance run
  # from the obsolete shared-queue acceptance job. Future v2 runs remain serialized.
  group: cf-serviceops-production-v2
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

    steps:
      - name: Checkout canonical production source
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test intake and matching recovery boundaries
        run: |
          node tests/recent-gf-backstop.test.cjs
          node tests/matching-cache-recovery.test.cjs
          node tests/readiness-patch.test.mjs
          node tests/hardening-install.test.cjs
          node tests/cache-grid-maintenance.test.cjs

      - name: Require existing clasp authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}" || { echo "CLASPRC_JSON repository secret is missing."; exit 2; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx -y @google/clasp@3.3.0 show-authorized-user --json

      - name: Deploy checkpointed single-model release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs --execute

      - name: Verify live single-model runtime
        shell: bash
        env:
          HEALTH_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            BODY="$(curl -fsSL --retry 2 --max-time 20 --get --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$HEALTH_URL" || true)"
            if [ -n "$BODY" ]; then
              echo "LIVE_HEALTH_ATTEMPT=$attempt $BODY"
              if node -e '
                const x = JSON.parse(process.argv[1]);
                const ok =
                  x &&
                  x.version === "5.14.4" &&
                  x.singleModelVerified === true &&
                  x.automationEnabled === true &&
                  Number(x.legacyAutomationTriggerCount) === 0 &&
                  Number(x.watchdogTriggers) === 1 &&
                  Number(x.finalWorkerTriggers) <= 1;
                process.exit(ok ? 0 : 1);
              ' "$BODY"; then
                echo "LIVE_SINGLE_MODEL_VERIFY_PASS"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "LIVE_SINGLE_MODEL_VERIFY_FAILED"
          exit 1

      - name: Install intake backstop trigger
        shell: bash
        env:
          INTAKE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --max-time 60 --get \
            --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-urlencode "ops=install-intake-backstop" "$INTAKE_URL")"
          echo "INTAKE_BACKSTOP_INSTALL=$BODY"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x || x.ok!==true || x.status!=="INTAKE_BACKSTOP_INSTALLED") process.exit(2);
          ' "$BODY"

      - name: Inspect recent intake mapping without writes
        shell: bash
        env:
          INTAKE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --max-time 120 --get \
            --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-urlencode "ops=intake-mapping-snapshot" \
            --data-urlencode "id=3543" "$INTAKE_URL" || true)"
          echo "INTAKE_MAPPING_SNAPSHOT=$BODY"

      - name: Recover missed recent Gravity Forms intake
        shell: bash
        env:
          INTAKE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --max-time 180 --get \
            --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-urlencode "ops=intake-backstop-run" "$INTAKE_URL")"
          echo "RECENT_GF_BACKSTOP=$BODY"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x || x.ok!==true) process.exit(2);
            console.log("RECENT_GF_BACKSTOP_PASS");
            console.log("RECOVERED_REQUEST_IDS="+JSON.stringify(x.recoveredRequestIds||[]));
          ' "$BODY"

      - name: Run frozen recent-10 acceptance cohort
        shell: bash
        env:
          ACCEPTANCE_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          IDS=(
            SR-20261006104413-7346
            SR-20261005182859-2159
            SR-20261005121227-9352
            SR-20261005084731-2148
            SR-20261004220141-5643
            SR-20261004203633-9340
            SR-20261004115129-2627
            SR-20261004104029-7927
            SR-20261003160054-7269
            SR-20261003120429-6643
          )
          : > recent10-acceptance.jsonl
          for id in "${IDS[@]}"; do
            completed=0
            for round in $(seq 1 8); do
              BODY="$(curl -fsSL --retry 2 --max-time 120 --get \
                --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-urlencode "ops=recent10-acceptance-step" \
                --data-urlencode "id=$id" "$ACCEPTANCE_URL")"
              printf '%s\n' "$BODY" | tee -a recent10-acceptance.jsonl
              if node -e '
                const x=JSON.parse(process.argv[1]);
                if(!x || x.requestId!==process.argv[2]) process.exit(2);
                const done=x.currentStage==="COMPLETED" && x.requestStatus==="COMPLETED" && String(x.manualReview||"").toUpperCase()!=="YES";
                process.exit(done ? 0 : 1);
              ' "$BODY" "$id"; then
                completed=1
                break
              fi
              sleep 2
            done
            if [ "$completed" -ne 1 ]; then
              echo "RECENT10_REQUEST_FAILED_TO_COMPLETE=$id"
              exit 3
            fi
          done
          echo "RECENT10_ACCEPTANCE_PASS_ALL_10"

      - name: Refresh live Dashboard
        shell: bash
        env:
          DASHBOARD_URL: https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --max-time 90 --get \
            --data-urlencode "nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-urlencode "ops=dashboard-refresh" "$DASHBOARD_URL")"
          echo "DASHBOARD_REFRESH=$BODY"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x || x.ok!==true || x.status!=="DASHBOARD_REFRESHED") process.exit(2);
            if(!x.metrics || Number(x.metrics.total||0)<1) process.exit(3);
            console.log("DASHBOARD_REFRESH_PASS");
          ' "$BODY"

      - name: Upload recent-10 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-recent10-acceptance
          path: recent10-acceptance.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Upload pre-change live checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-live-before-v5.14.4
          path: |
            .release-v5.14.4/before/**
            .release-v5.14.4/before.sha256.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-serviceops-v5.14.4-deploy-verification
          path: |
            .release-v5.14.4/verify/**
            .release-v5.14.4/deployed-version.txt
          retention-days: 30
          if-no-files-found: warn

