name: Release ServiceOps operational cache freshness alignment
on:
  push:
    branches: [fix/cache-freshness-alignment-20261103]
    paths: [releases/activate-cache-freshness-20261103]
permissions:
  contents: read
concurrency:
  group: cf-serviceops-production-v2
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: |
          set -euo pipefail
          for f in tests/*.cjs tests/*.mjs; do node "$f"; done
          node --check scripts/cache-window-release.mjs
      - name: Fetch verified live backup and check source
        run: |
          set -euo pipefail
          git fetch --no-tags origin fix/manual-notes-fast-certification-20261102
          git cat-file -e d6cd890fc95bb82b5f1241c812e0232bcefdd971^{commit}
          test -n "$CLASPRC_JSON"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node scripts/cache-window-release.mjs prepare
      - name: Save immediate live source backup
        uses: actions/upload-artifact@v4
        with:
          name: cache-window-release-before-${{ github.run_id }}
          path: |
            .cache-window-release/before/*
            .cache-window-release/before-hashes.json
            .cache-window-release/previous-version.txt
          if-no-files-found: error
          retention-days: 90
      - name: Deploy single-module change
        run: node scripts/cache-window-release.mjs apply
      - name: Restore verified source and deployment after failure
        if: failure()
        run: node scripts/cache-window-release.mjs rollback
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-window-release-evidence-${{ github.run_id }}
          path: |
            .cache-window-release/verify/*
            .cache-window-release/deployed-version.txt
          if-no-files-found: warn
          retention-days: 90
