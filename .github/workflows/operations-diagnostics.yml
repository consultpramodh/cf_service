name: Inspect Operations Web access
on:
  push:
    branches: [feat/operations-web-20261023]
    paths: ['operations-diagnostics/**','.github/workflows/operations-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node operations-diagnostics/inspect.mjs
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
