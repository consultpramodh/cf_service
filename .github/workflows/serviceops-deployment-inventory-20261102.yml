name: Inspect ServiceOps deployment versions
on:
  push:
    branches: [audit/live-source-20261029]
    paths: [.github/workflows/serviceops-deployment-inventory-20261102.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read deployments and versions
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          mkdir script && cd script
          printf '%s\n' '{"scriptId":"1QZp4NAFeA8LmWBN31ylJYdK4XFepBX1h2lP_APaR-d1lTAC-d8LA9x3g","rootDir":"."}' > .clasp.json
          npx -y @google/clasp@3.3.0 deployments
          npx -y @google/clasp@3.3.0 versions
