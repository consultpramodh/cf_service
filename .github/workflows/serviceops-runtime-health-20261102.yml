name: Inspect ServiceOps runtime health
on:
  push:
    branches: [audit/live-source-20261029]
    paths: [.github/workflows/serviceops-runtime-health-20261102.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read health without processing requests
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 'https://script.google.com/macros/s/AKfycbwebnCvczGthe6Z_mvYmukLqFLB-9nk8hjNtNP3lR87CE1m_fEx2d9Bn_vpXMPCLUnPbA/exec' > health.json
          node -e "const x=require('./health.json'); console.log(JSON.stringify(x)); if(x.singleModelVerified!==true||x.automationEnabled!==true) process.exit(2)"
